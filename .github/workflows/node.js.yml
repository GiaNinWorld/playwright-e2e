name: Build and Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:   
    - cron: '0 12 * * *'

jobs:
  build:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Use Node.js 22
      uses: actions/setup-node@v6.0.0
      with:
        node-version: 22
        cache: 'npm'      
    - run: npm install 
    - run: npx playwright install --with-deps msedge
    - run: npm run actions  
      env:
        ZEROSTEP_TOKEN: ${{ secrets.ZEROSTEP_TOKEN }}       

  sonarcloud:
    name: Run SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Validate SonarCloud configuration
        shell: bash
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Configure the SONAR_TOKEN secret in Settings > Secrets and variables > Actions. See README.md."
            exit 1
          fi
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0  
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 22 
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0    
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
